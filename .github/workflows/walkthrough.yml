name: Record demo walkthrough
on:
  workflow_dispatch: {}
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Diagnostics
        run: |
          set -x
          command -v node ffmpeg npx cp || true
          node -v; npm -v; ffmpeg -version | head -1
      - name: Set up recorder (isolated from the app)
        run: |
          set -eux
          mkdir -p "$RUNNER_TEMP/rec"
          cd "$RUNNER_TEMP/rec"
          npm init -y
          npm i playwright@latest
          npx playwright install --with-deps chromium
      - name: Record + convert
        run: |
          set -eux
          cd "$RUNNER_TEMP/rec"
          cp "$GITHUB_WORKSPACE/scripts/record-walkthrough.mjs" ./record.mjs
          node record.mjs
          ls -la recording
          ffmpeg -y -i recording/walkthrough.webm -c:v libx264 -pix_fmt yuv420p -movflags +faststart recording/walkthrough.mp4
          ffmpeg -y -i recording/walkthrough.webm -vf "fps=15,scale=1000:-1:flags=lanczos" recording/walkthrough.gif
          mkdir -p "$GITHUB_WORKSPACE/recording"
          cp recording/walkthrough.* "$GITHUB_WORKSPACE/recording/"
          ls -la "$GITHUB_WORKSPACE/recording"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: demo-walkthrough
          path: recording/*
          if-no-files-found: warn
