# Render Blueprint for Office Pick'em League (Next.js 14 + Prisma + Neon).
# Free tier: the web service sleeps after ~15 min idle (cold start on next hit).
# Cron is handled by GitHub Actions (.github/workflows/cron.yml), not Render.
services:
  - type: web
    name: officepickemleague
    runtime: node
    plan: free
    region: ohio              # change to match your Neon DB region for lowest latency
    branch: main
    autoDeploy: true
    healthCheckPath: /
    # postinstall runs `prisma generate`; then push schema, seed (idempotent), build.
    # --accept-data-loss: `db push` is non-interactive here, so ANY warning (e.g. adding a
    # unique constraint) fails the whole deploy without it. Schema is the source of truth and
    # we only add fields; switch to `prisma migrate deploy` if destructive changes ever land.
    # `prisma db push` uses the DIRECT (non-pooled) Neon endpoint, which auto-suspends on
    # free tier — a build landing on a cold DB throws P1001. Retry up to 5× (48s) to let
    # Neon resume before failing the deploy.
    buildCommand: npm install && (n=0; until npx prisma db push --accept-data-loss; do n=$((n+1)); [ "$n" -ge 5 ] && exit 1; echo "prisma db push failed; retry $n/4 in 12s (Neon cold start?)"; sleep 12; done) && node scripts/seed.js && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: SEASON
        value: "2026"
      - key: NEXT_PUBLIC_BASE_URL
        value: https://officepickemleague.com
      # --- secrets: set these in the Render dashboard (sync:false keeps them out of git) ---
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: ODDS_API_KEY
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: OPS_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      - key: TWILIO_MESSAGING_SERVICE_SID
        sync: false
      # --- Telnyx (SMS provider — brand VERIFIED 2026-07-19). messaging.ts is provider-agnostic;
      #     set SMS_PROVIDER=telnyx in the dashboard to cut over once the A2P campaign + number are
      #     provisioned. Leaving SMS_PROVIDER unset keeps the twilio-10dlc default (no premature switch). ---
      - key: SMS_PROVIDER
        sync: false
      - key: TELNYX_API_KEY
        sync: false
      - key: TELNYX_MESSAGING_PROFILE_ID
        sync: false
      - key: TELNYX_FROM_NUMBER
        sync: false
      # Ed25519 public key that signs inbound webhooks. REQUIRED — src/app/api/sms/telnyx returns 503
      # in production without it, so pick-by-text / paper-photo ingestion silently fails.
      - key: TELNYX_WEBHOOK_PUBLIC_KEY
        sync: false
      # Concierge voice (Telnyx AI Assistant) — shared bearer secret the assistant sends
      # to /api/voice/agent. Generate one, set it here AND in each Telnyx tool's headers.
      - key: CONCIERGE_TOOL_SECRET
        sync: false
      - key: ALERT_PHONE
        sync: false
      # --- Stripe (founding checkout: setup-mode card save + manual Sept 9 charge; lib/billing.ts).
      #     Start with TEST keys (sk_test_...); swap to live once a test checkout passes end to end.
      #     STRIPE_WEBHOOK_SECRET = signing secret of the dashboard webhook endpoint pointed at
      #     /api/stripe/webhook (event: checkout.session.completed). ---
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
